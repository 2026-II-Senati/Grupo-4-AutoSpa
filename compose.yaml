# AutoSpa con Docker Compose.
# - mysql: base de datos (siempre).
# - app:   frontend React compilado + API Express en una sola URL.
# Configuración: copia .env.example como .env en esta misma carpeta (raíz del repositorio).
# Guía: docs/instalacion.md, secciones 8 (solo MySQL) y 9 (aplicación completa).
name: autospa

services:
  mysql:
    # Versión concreta, compatible con las migraciones (requieren MySQL 8.0.16 o posterior).
    image: mysql:8.4.9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el .env de la raíz}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autospa}
      # Usuario de la aplicación: recibe todos los permisos solo sobre MYSQL_DATABASE.
      # El backend usa este usuario, nunca root.
      MYSQL_USER: ${MYSQL_USER:-autospa_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en el .env de la raíz}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # Solo accesible desde esta computadora. Por defecto 3307 para no chocar con un MySQL local en 3306.
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Responde cuando el servidor MySQL acepta conexiones por TCP (no usa contraseñas).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: autospa-app:local
    restart: unless-stopped
    depends_on:
      mysql:
        # La aplicación arranca solo cuando MySQL responde.
        condition: service_healthy
    # Variables adicionales de la aplicación (por ejemplo, las de autenticación cuando se integre).
    # Archivo opcional .env.app en la raíz; no se sube al repositorio.
    env_file:
      - path: .env.app
        required: false
    environment:
      PORT: "3001"
      # Conexión interna entre contenedores: nombre del servicio y puerto interno.
      # El 3307 publicado es solo para acceder desde la computadora.
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-autospa}
      DB_USER: ${MYSQL_USER:-autospa_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en el .env de la raíz}
      DB_LOGGING: "false"
    ports:
      # Una sola URL para React y /api. Por defecto 8080, para no chocar con el backend local en 3001.
      - "127.0.0.1:${APP_PORT:-8080}:3001"

volumes:
  # Volumen con nombre: conserva tablas y datos al detener y volver a iniciar los contenedores.
  mysql-data:
